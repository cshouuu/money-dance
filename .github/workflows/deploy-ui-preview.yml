name: Deploy UI Refresh Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/ui-refresh]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package*.json'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/deploy-ui-preview.yml'

permissions:
  contents: read

concurrency:
  group: ui-refresh-preview
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Enforce UI-only change boundary
        shell: bash
        run: |
          set -euo pipefail
          protected_changes="$(git diff --name-only origin/main...HEAD | grep -E '^(packages/core/|apps/api/|apps/android/|apps/web/src/lib/|apps/web/src/types\.ts$|apps/web/src/main\.tsx$|apps/web/index\.html$|apps/web/sw-template\.js$|apps/web/functions/)' || true)"
          if [ -n "$protected_changes" ]; then
            echo "Protected business, storage, PWA, API, or native files changed:" >&2
            echo "$protected_changes" >&2
            exit 1
          fi
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Build web preview
        run: npm run build -w @salary-flow/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview deploy skipped because Cloudflare credentials are not configured."
          fi
      - name: Deploy isolated Pages branch preview
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy --project-name=money-dance --branch=feature/ui-refresh
      - name: Record isolation boundary
        run: echo "Preview branch feature/ui-refresh deployed without updating the production branch main." >> "$GITHUB_STEP_SUMMARY"
