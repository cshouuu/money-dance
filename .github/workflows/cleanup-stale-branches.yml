name: Cleanup stale branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Delete stale remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'chore/release-flow-readme'
            'dependabot/npm_and_yarn/lucide-react-1.33.0'
            'dependabot/npm_and_yarn/types/node-26.2.0'
            'dependabot/npm_and_yarn/typescript-7.0.2'
            'dependabot/npm_and_yarn/vitejs/plugin-react-6.1.0'
            'dependabot/npm_and_yarn/vitest-4.1.11'
            'feature/ledger-summary-living-cost'
            'feature/mobile-apps'
            'feature/mobile-ui-polish'
            'feature/mvp'
            'feature/record-list-pagination'
            'feature/salaryflow-mvp'
            'fix/converter-display-mobile'
            'fix/converter-result-alignment'
            'fix/converter-result-tail-position'
            'fix/hide-purchased-wishlist-items'
            'fix/mobile-dock-glass-drawer'
            'fix/wishlist-card-layout'
            'security/dependabot-actions-hardening'
            'security/dependency-hardening'
            '__cleanup-probe'
            '__cleanup-runner'
            '__cleanup-trigger'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
