name: Deploy PWA Stability Lab

on:
  workflow_dispatch:
  push:
    branches: [pwa-stability-lab]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package*.json'
      - '.github/workflows/deploy-pwa-stability-lab.yml'

permissions:
  contents: read

concurrency:
  group: pwa-stability-lab
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pwa-stability-lab
      url: https://pwa-stability-lab.money-dance-6gl.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w @salary-flow/core
      - run: npm test -w @salary-flow/web
      - run: npm run build -w @salary-flow/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are required for the isolated PWA environment." >&2
            exit 1
          fi
      - name: Deploy isolated Pages preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy --project-name=money-dance --branch=pwa-stability-lab
      - name: Verify isolated PWA shell
        run: node apps/web/scripts/verify-live-pwa.mjs https://pwa-stability-lab.money-dance-6gl.pages.dev/ --expect-sw-no-store
