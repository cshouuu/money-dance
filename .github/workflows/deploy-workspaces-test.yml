name: Deploy Workspaces Test to Cloudflare

on:
  push:
    branches: [codex/workspaces-test]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/web/index.html'
      - 'apps/web/vite.config.ts'
      - 'apps/web/sw-template.js'
      - 'packages/core/**'
      - 'package*.json'
      - '.github/workflows/deploy-workspaces-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspaces-test-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/workspaces-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @salary-flow/core
      - name: Verify first-launch settings interactions
        run: npm run test --workspace @salary-flow/web -- src/components/SalarySetup.interaction.test.tsx
      - run: npm run build --workspace @salary-flow/web
      - name: Stage isolated static test site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workspaces-site"
          cp -R apps/web/dist/. "$RUNNER_TEMP/workspaces-site/"
          if grep -q '我的工作空间' apps/web/dist/assets/main-*.js; then
            echo 'Removed homepage module is still present in the build.' >&2
            exit 1
          fi
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/workspaces-site/test-build.json", JSON.stringify({environment:"workspaces-test",commit:process.env.GITHUB_SHA,buildTime:new Date().toISOString(),homepageWorkspaceOverview:false}));'
      - name: Deploy only the workspace test project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd "$RUNNER_TEMP/workspaces-site"
          wrangler="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          "$wrangler" pages project list --json > "$RUNNER_TEMP/workspaces-projects.json"
          if ! node -e 'const projects=require(process.env.RUNNER_TEMP + "/workspaces-projects.json"); process.exit(projects.some(project=>project["Project Name"]==="money-dance-workspaces-test")?0:1)'; then
            "$wrangler" pages project create money-dance-workspaces-test --production-branch=preview-only
          fi
          "$wrangler" pages deploy . --project-name=money-dance-workspaces-test --branch=workspaces --commit-hash="$GITHUB_SHA" --commit-dirty=false
          echo 'Workspace test website: https://workspaces.money-dance-workspaces-test.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the published test build over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          site='https://workspaces.money-dance-workspaces-test.pages.dev'
          verified=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 "$site/test-build.json?commit=$GITHUB_SHA&attempt=$attempt" -o "$RUNNER_TEMP/deployed-build.json" &&
              node -e 'const build=require(process.env.RUNNER_TEMP + "/deployed-build.json"); console.log("Expected commit:",process.env.GITHUB_SHA,"served:",build.commit); if(build.commit!==process.env.GITHUB_SHA || build.environment!=="workspaces-test" || build.homepageWorkspaceOverview!==false) process.exit(1);'; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = true
          curl --fail --silent --show-error --max-time 20 "$site/" -o "$RUNNER_TEMP/deployed-index.html"
          curl --fail --silent --show-error --max-time 20 "$site/spaces" -o "$RUNNER_TEMP/deployed-spaces.html"
          cmp "$RUNNER_TEMP/deployed-index.html" "$RUNNER_TEMP/deployed-spaces.html"
