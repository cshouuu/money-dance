name: Work Journey Preview

on:
  push:
    branches: [feature/work-journey]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-journey-preview
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/feature/work-journey'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package reproducible verification workspace
        run: tar --exclude=.git --exclude='*.tgz' -czf /tmp/work-journey-workspace.tgz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: work-journey-workspace
          path: /tmp/work-journey-workspace.tgz
          retention-days: 3
          if-no-files-found: error
