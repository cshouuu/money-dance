name: Publish official holiday data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/chinaHolidays.data.json'
      - '.github/workflows/publish-holiday-data.yml'

permissions:
  contents: read

concurrency:
  group: publish-official-holiday-data
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate holiday data and update behavior
        run: npm run test -w @salary-flow/web -- src/lib/chinaHolidays.test.ts
      - name: Publish data without building or releasing the app
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler r2 object put money-dance-releases/data/china-holidays.json
          --file src/lib/chinaHolidays.data.json
          --content-type application/json --cache-control no-store --remote --force
      - name: Verify published data
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 'https://money-dance-6gl.pages.dev/holidays/china.json' -o "$RUNNER_TEMP/china-holidays.json" &&
              cmp apps/web/src/lib/chinaHolidays.data.json "$RUNNER_TEMP/china-holidays.json"; then
              echo 'Official holiday data is live'
              exit 0
            fi
            sleep 5
          done
          echo 'Holiday data verification failed' >&2
          exit 1
