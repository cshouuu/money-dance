name: Bootstrap Money Dance MVP

on:
  push:
    branches:
      - feature/mvp

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp
          fetch-depth: 0

      - name: Expand verified MVP source
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/money-dance-bootstrap.zip
          unzip -o /tmp/money-dance-bootstrap.zip -d . || true
          mkdir -p docs
          cat > docs/PROTOTYPE.md <<'EOF'
          # Money Dance 页面原型

          ## 1. 今日 / Dashboard

          ```text
          ┌──────────────────────────────────────┐
          │ Money Dance                   设置   │
          │                                      │
          │ 今天已经赚了                         │
          │          ¥ 387.4621                  │
          │          + ¥0.02395 / 秒             │
          │                                      │
          │ 09:00 ━━━━━━━━━●━━━━━━━━ 18:00       │
          │ 工作进度 56%      距离下班 3h 32m   │
          │                                      │
          │ 今日预计 ¥689.66  当前已赚 ¥387.46  │
          │                                      │
          │ 🐟 摸鱼模式                          │
          │             [ 开始摸鱼 ]             │
          │                                      │
          │ 快捷换算                             │
          │ ☕ ¥32 = 22分钟   🎧 ¥1899 = 2.75天 │
          └──────────────────────────────────────┘
          ```

          核心交互：实时金额按当前时间重新计算；工作前为 0，下班后封顶；午休是否计薪跟随用户配置。

          ## 2. 换算 / Converter

          ```text
          ┌──────────────────────────────────────┐
          │ 值得几小时？                         │
          │ 名称  [ AirPods Pro              ]   │
          │ 价格  [ ¥1899                    ]   │
          │                         [ 添加 ]      │
          │                                      │
          │ AirPods Pro                          │
          │ ¥1,899                               │
          │ = 22小时 1分钟                       │
          │ = 2.75 个工作日                      │
          └──────────────────────────────────────┘
          ```

          支持新增、删除多个目标商品；换算统一基于当前薪资档案的有效计薪时间。

          ## 3. 摸鱼 / Slacking

          ```text
          ┌──────────────────────────────────────┐
          │ 🐟 正在摸鱼……                        │
          │             00:13:27                 │
          │ 老板已经为本次摸鱼支付               │
          │              ¥19.32                  │
          │          + ¥0.02395 / 秒             │
          │             [ 结束摸鱼 ]             │
          │                                      │
          │ 今天 52m / ¥74.71                    │
          │ 本周 4h18m / ¥370.68                 │
          │ 最近记录                             │
          └──────────────────────────────────────┘
          ```

          开始时只保存时间戳；刷新/锁屏后按时间戳恢复。结束时保存 start/end/duration/amount 快照。

          ## 4. 物品 / Assets

          ```text
          ┌──────────────────────────────────────┐
          │ 我的物品                    [+ 新增] │
          │                                      │
          │ 💻 MacBook Pro                       │
          │ ¥14,999                              │
          │ 已拥有 317天 9小时                   │
          │ 当前持有成本                         │
          │              ¥1.97 / 小时 ↓          │
          │              ¥47.2 / 天              │
          └──────────────────────────────────────┘
          ```

          新增字段：名称、价格、购买日期、分类。若购买日期在未来则阻止保存；成本按 `价格 / 已持有小时` 动态下降。

          ## 5. 设置 / Settings

          ```text
          ┌──────────────────────────────────────┐
          │ 薪资设置                             │
          │ 工资         [ 15000 ]               │
          │ 工资类型     [ 月薪 ▼ ]              │
          │ 月工作日     [ 21.75 ]               │
          │ 上班时间     [ 09:00 ]               │
          │ 下班时间     [ 18:00 ]               │
          │ 午休         [12:00] - [13:00]       │
          │ [ ] 午休计薪                         │
          │                         [ 保存 ]      │
          └──────────────────────────────────────┘
          ```

          保存后立即影响首页、换算和摸鱼计算；MVP 数据默认保存在浏览器 localStorage。

          ## 响应式规则

          - Desktop：左侧导航 + 主内容区，核心数字保持首屏视觉中心。
          - Mobile：底部 5 项导航（今日 / 换算 / 摸鱼 / 物品 / 我的）。
          - 实时金额可高频视觉刷新，但业务值始终由时间戳推导，不累计浮点增量。
          - 金额默认显示 2 位；首页实时金额可显示 4 位以强化“正在赚钱”的动态感。
          EOF
          sed -i 's/^          //' docs/PROTOTYPE.md
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-mvp.yml

      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Money Dance MVP"
          git push origin HEAD:feature/mvp
