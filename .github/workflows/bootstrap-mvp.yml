name: Bootstrap Money Dance MVP

on:
  push:
    branches:
      - feature/mvp

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp
          fetch-depth: 0
      - name: Expand MVP source
        run: |
          unzip -o .bootstrap/money-dance-bootstrap.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-mvp.yml
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Money Dance MVP"
          git push origin HEAD:feature/mvp
