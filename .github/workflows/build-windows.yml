name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package*.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets -w @salary-flow/desktop
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:windows
      - name: Verify packaged native runtime and restart persistence
        run: node apps/desktop/scripts/verify-package.cjs
      - name: Desktop integration smoke test
        run: npm run start -w @salary-flow/desktop
        env:
          MONEY_DANCE_SMOKE: '1'
      - name: Calculate SHA-256
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: money-dance-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.sha256
            output/windows-pet-*.png
          if-no-files-found: error
